<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Dashboard V2</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23ff5a2e'/%3E%3Cpath d='M32 12l20 20-20 20L12 32z' fill='%230d0b09'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d0b09; --surface:#171310; --surface2:#201a15; --line:rgba(242,236,224,.09);
  --text:#f2ece0; --muted:#a79c8a; --body:#d8d0c2;
  --ember:#ff5a2e; --ember-soft:rgba(255,90,46,.14); --gold:#e6b34d;
  --font-d:'Unbounded',sans-serif; --font-b:'Space Grotesk',sans-serif; --font-m:'Space Mono',monospace;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-b);overflow-x:hidden}
::selection{background:var(--ember);color:#180b06}
button,input,textarea,select{font-family:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--ember);outline-offset:2px}
body::after{content:"";position:fixed;top:0;right:0;bottom:0;left:0;z-index:2;pointer-events:none;
  background:radial-gradient(120% 90% at 50% 8%, transparent 52%, rgba(0,0,0,.5))}
#dust{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none}
#grain{position:fixed;top:-50%;left:-50%;width:200%;height:200%;z-index:50;pointer-events:none;
  mix-blend-mode:overlay;opacity:.5}
#grain.live{animation:grainShift .9s steps(2) infinite}
@keyframes grainShift{0%,100%{transform:translate(0,0)}12%{transform:translate(-2%,3%)}25%{transform:translate(3%,-2%)}
  37%{transform:translate(-3%,-3%)}50%{transform:translate(2%,2%)}62%{transform:translate(-2%,1%)}
  75%{transform:translate(3%,3%)}87%{transform:translate(-1%,-2%)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes riseIn{from{opacity:0;transform:translateY(16px) rotate(-4deg) scale(.9)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(1turn)}}
@keyframes rip{to{transform:scale(1);opacity:0}}
@keyframes shim{to{background-position:-220% 0}}
@keyframes orbA{to{transform:translate(-9vw,12vh) scale(1.15)}}
@keyframes orbB{to{transform:translate(10vw,-10vh) scale(1.1)}}
@keyframes pulseRing{0%{transform:scale(.9);opacity:.7}70%{transform:scale(1.18);opacity:0}100%{transform:scale(1.18);opacity:0}}
@keyframes focusPulse{0%,100%{box-shadow:0 0 0 4px var(--ember-soft),0 22px 60px rgba(0,0,0,.45)}
  50%{box-shadow:0 0 0 8px rgba(255,90,46,.07),0 22px 60px rgba(0,0,0,.45)}}
@keyframes sheen{to{background-position:-220% 0}}
@keyframes ddIn{from{opacity:0;transform:translateY(-8px) scale(.985)}to{opacity:1;transform:none}}
@keyframes rowIn{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
@keyframes chipPulse{0%,100%{box-shadow:0 0 0 0 rgba(255,90,46,.45)}50%{box-shadow:0 0 0 7px rgba(255,90,46,0)}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

/* aurora orbs */
.orb{position:fixed;border-radius:50%;filter:blur(90px);-webkit-filter:blur(90px);pointer-events:none;z-index:1;will-change:transform}
.orb.o1{width:44vw;height:44vw;top:-12vw;right:-10vw;opacity:.16;
  background:radial-gradient(circle,#ff5a2e,transparent 65%);animation:orbA 26s ease-in-out infinite alternate}
.orb.o2{width:38vw;height:38vw;bottom:-14vw;left:-10vw;opacity:.1;
  background:radial-gradient(circle,#e6b34d,transparent 65%);animation:orbB 32s ease-in-out infinite alternate}

/* top bar + tabs */
.top{position:sticky;top:0;z-index:30;border-bottom:1px solid var(--line);
  background:rgba(13,11,9,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.top .wrap{display:flex;align-items:center}
.brand{display:flex;align-items:center;text-decoration:none;color:var(--text);padding:12px 18px 12px 0;margin-right:6px}
.mark{width:28px;height:28px;border-radius:9px;background:var(--ember);display:flex;align-items:center;
  justify-content:center;color:#180b06;margin-right:9px;flex:none;transition:transform .45s cubic-bezier(.2,.8,.25,1)}
.brand:hover .mark{transform:rotate(90deg)}
.wordmark{font-family:var(--font-d);font-weight:700;font-size:13px;letter-spacing:.05em;white-space:nowrap}
.wordmark i{font-style:normal;font-family:var(--font-m);font-size:8px;color:var(--ember);margin-left:4px;vertical-align:super}
.tabs{display:flex;position:relative;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;flex:1}
.tabs::-webkit-scrollbar{display:none}
.tab-ind{position:absolute;bottom:0;height:2px;background:var(--ember);border-radius:2px;
  box-shadow:0 0 12px var(--ember);opacity:0;
  transition:left .32s cubic-bezier(.2,.8,.25,1),width .32s cubic-bezier(.2,.8,.25,1),opacity .3s}
.tabbtn{flex:none;background:none;border:none;color:var(--muted);font:400 11px var(--font-m);
  letter-spacing:.14em;padding:18px 12px 16px;cursor:pointer;transition:color .2s;min-height:48px;white-space:nowrap}
.tabbtn:hover{color:var(--text)}
.tabbtn.on{color:var(--ember)}
header.top,main,footer{position:relative;z-index:3}
.wrap{max-width:1200px;margin:0 auto;padding:0 20px}

/* panels */
.panel{display:none;min-height:70vh}
.panel.on{display:block;animation:fadeUp .4s cubic-bezier(.2,.8,.25,1)}
.pwrap{max-width:1200px;margin:0 auto;padding:26px 20px 80px}
.pwrap .searchwrap{max-width:640px}

/* command */
.command-center{min-height:calc(100vh - 150px);display:flex;flex-direction:column;align-items:center;
  justify-content:center;padding:40px 20px 90px}
.glyph{width:46px;height:46px;border-radius:16px;background:var(--ember);display:flex;align-items:center;
  justify-content:center;color:#180b06;box-shadow:0 16px 44px rgba(255,90,46,.26);position:relative;
  animation:riseIn .7s cubic-bezier(.2,.8,.25,1) both;margin-bottom:20px}
.glyph::after{content:"";position:absolute;top:-8px;left:-8px;right:-8px;bottom:-8px;
  border:1px solid rgba(255,90,46,.4);border-radius:22px;animation:pulseRing 2.6s ease-out infinite}
.searchcol{width:min(720px,94vw);position:relative;animation:riseIn .7s .08s cubic-bezier(.2,.8,.25,1) both}
.searchwrap{display:flex;align-items:center;background:var(--surface);border:1px solid var(--line);
  border-radius:999px;padding:8px 8px 8px 22px;box-shadow:0 22px 60px rgba(0,0,0,.45);
  transition:border-color .25s,box-shadow .25s}
.searchwrap:focus-within{border-color:var(--ember);animation:focusPulse 2.4s ease-in-out infinite}
.searchwrap>svg{flex:none;color:var(--muted);margin-right:12px}
.searchwrap input{flex:1;min-width:0;height:46px;background:none;border:none;outline:none;
  color:var(--text);font:500 16px/1.4 var(--font-b)}
.searchwrap input::placeholder{color:var(--muted);opacity:.85}
#cmdbar.open{border-bottom-left-radius:0;border-bottom-right-radius:0}
.bgo{flex:none;position:relative;overflow:hidden;border:none;border-radius:999px;background:var(--ember);
  color:#180b06;font:700 12px var(--font-m);letter-spacing:.14em;padding:0 22px;min-height:46px;
  cursor:pointer;display:inline-flex;align-items:center;transition:transform .18s,filter .18s}
.bgo::before{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);
  transform:skewX(-20deg);transition:left .5s}
.bgo:hover{transform:translateY(-1px);filter:brightness(1.08)}
.bgo:hover::before{left:120%}
.bgo:active{transform:scale(.97)}
.bgo.loading{color:transparent}
.bgo.loading::after{content:"";position:absolute;top:0;right:0;bottom:0;left:0;margin:auto;width:15px;height:15px;
  border:2px solid rgba(24,11,6,.3);border-top-color:#180b06;border-radius:50%;animation:spin .7s linear infinite}
.btn-ghost{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:999px;
  min-height:44px;padding:0 18px;font:600 11px var(--font-m);letter-spacing:.12em;cursor:pointer;
  display:inline-flex;align-items:center;transition:.2s}
.btn-ghost:hover{border-color:var(--ember);color:var(--ember)}
.btn-ghost.on{border-color:var(--ember);color:var(--ember);background:var(--ember-soft)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{background:none;border:none;color:var(--muted);font:400 11px var(--font-m);
  letter-spacing:.14em;padding:11px 18px;cursor:pointer;min-height:44px;transition:.2s}
.seg button.on{background:var(--ember);color:#180b06}
.trow{display:flex;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.trow>*{margin:0 12px 8px 0}

/* dropdown */
.dd{position:absolute;top:100%;left:0;right:0;margin-top:-1px;background:var(--surface);
  border:1px solid var(--line);border-top:0;border-radius:0 0 22px 22px;
  box-shadow:0 30px 80px rgba(0,0,0,.55);padding:18px;z-index:12;text-align:left;
  transform-origin:top center;animation:ddIn .18s cubic-bezier(.2,.8,.25,1)}
.dd-recwrap{position:relative;border-radius:18px;padding:1px;
  background:linear-gradient(110deg,rgba(255,90,46,.55),rgba(255,90,46,.08) 30%,rgba(230,179,77,.28) 50%,rgba(255,90,46,.08) 70%,rgba(255,90,46,.55));
  background-size:220% 100%;animation:sheen 3.4s linear infinite}
.dd-recin{background:linear-gradient(120deg,rgba(255,90,46,.13),var(--surface) 62%);border-radius:17px;padding:16px 18px}
.ddrectop{display:flex;align-items:center;flex-wrap:wrap}
.ichip{font:700 10px var(--font-m);letter-spacing:.2em;color:#180b06;background:var(--ember);
  border-radius:999px;padding:5px 12px;margin-right:12px;animation:chipPulse 2.8s ease-in-out infinite}
.ddwhy{font:400 10px/1.6 var(--font-m);color:var(--muted)}
.ddrecname{font:700 21px var(--font-b);margin:10px 0 8px}
.dddork{font:400 12px/1.6 var(--font-m);color:var(--body);background:rgba(0,0,0,.3);
  border:1px solid var(--line);border-radius:10px;padding:9px 13px;word-break:break-word}
.ddrecbtns{display:flex;align-items:center;margin-top:13px}
.ddrecbtns .bgo{margin-right:14px}
.ddenter{font:400 9px var(--font-m);letter-spacing:.18em;color:var(--muted)}
.dd-div{height:1px;background:var(--line);margin:16px -18px}
.dd-cat{grid-column:1/-1;font:400 8px var(--font-m);letter-spacing:.26em;color:var(--muted);
  margin:12px 0 5px;opacity:.85}
.dd-list{display:grid;grid-template-columns:1fr 1fr;grid-gap:4px;max-height:300px;overflow-y:auto;
  padding-right:4px;scrollbar-width:thin;scrollbar-color:var(--surface2) transparent}
.dd-list::-webkit-scrollbar{width:8px}
.dd-list::-webkit-scrollbar-track{background:transparent}
.dd-list::-webkit-scrollbar-thumb{background:var(--surface2);border-radius:4px}
.dd-list::-webkit-scrollbar-thumb:hover{background:rgba(255,90,46,.5)}
.dd-list.static .ddrow{animation:none}
.ddrow{display:flex;align-items:center;background:none;border:1px solid transparent;border-radius:12px;
  min-height:46px;padding:0 14px;cursor:pointer;color:var(--body);font:600 13px var(--font-b);
  text-align:left;position:relative;overflow:hidden;
  animation:rowIn .3s both;animation-delay:var(--d,0ms)}
.ddrow .dot{width:6px;height:6px;border-radius:50%;flex:none;margin-right:10px}
.ddrow i{font-style:normal;font:400 8px var(--font-m);letter-spacing:.14em;color:var(--muted);
  margin-left:auto;padding-left:10px;white-space:nowrap}
.ddrow::after{content:"";position:absolute;top:0;left:-40%;width:30%;height:100%;
  background:linear-gradient(100deg,transparent,rgba(255,90,46,.12),transparent);
  transform:skewX(-18deg);transition:left .45s}
.ddrow:hover{border-color:var(--ember);color:var(--text)}
.ddrow:hover::after{left:115%}
.ddrow.int{color:var(--text)}
.ddrow.int i{color:var(--ember)}
@media(max-width:620px){.dd-list{grid-template-columns:1fr}}

/* chips */
.chips{display:flex;flex-wrap:wrap;margin:14px 0 0}
.chips>*{margin:4px 10px 4px 0}
.rlabel{font:400 9px var(--font-m);letter-spacing:.22em;color:var(--muted)}
.chip{font:400 11px var(--font-m);color:var(--muted);background:none;border:1px solid var(--line);
  border-radius:999px;padding:10px 15px;cursor:pointer;transition:all .2s;min-height:40px}
.chip:hover{color:var(--text);border-color:var(--ember);transform:translateY(-2px)}
.pickrow{display:flex;flex-wrap:wrap;align-items:center;margin:10px 0 4px}
.pickrow>*{margin:4px 10px 4px 0}
.pchip{font:600 13px var(--font-b);color:var(--body);background:var(--surface);border:1px solid var(--line);
  border-radius:12px;min-width:48px;min-height:48px;padding:0 18px;cursor:pointer;transition:.18s}
.pchip:hover{border-color:var(--ember);color:var(--text);transform:translateY(-2px)}
.pchip.on{background:var(--ember);color:#180b06;border-color:var(--ember)}

/* movies */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));grid-gap:18px;margin-top:22px}
.grid .empty{grid-column:1/-1}
.card{cursor:pointer;animation:fadeUp .5s cubic-bezier(.2,.8,.25,1) backwards;animation-delay:var(--d,0ms)}
.poster{position:relative;padding-top:150%;border-radius:14px;overflow:hidden;background:var(--surface2);
  border:1px solid var(--line);box-shadow:0 14px 40px rgba(0,0,0,.4);
  transition:border-color .25s,transform .3s cubic-bezier(.2,.8,.25,1),box-shadow .3s}
.card:hover .poster{border-color:rgba(255,90,46,.5);transform:translateY(-6px);
  box-shadow:0 22px 50px rgba(255,90,46,.16),0 14px 40px rgba(0,0,0,.5)}
.poster img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;display:block;
  transform:scale(1.01);transition:transform .6s cubic-bezier(.2,.8,.25,1)}
.card:hover .poster img{transform:scale(1.07)}
.noimg{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;
  font:400 9px var(--font-m);letter-spacing:.2em;color:var(--muted);
  background:repeating-linear-gradient(45deg,var(--surface2) 0 12px,var(--surface) 12px 24px)}
.badge{position:absolute;top:8px;right:8px;display:flex;align-items:center;background:rgba(13,11,9,.82);
  border:1px solid var(--line);border-radius:999px;padding:4px 8px;font:400 11px var(--font-m);color:var(--gold)}
.badge svg{margin-right:3px}
.type{position:absolute;left:8px;bottom:8px;font:400 8px var(--font-m);letter-spacing:.2em;color:var(--text);
  background:rgba(13,11,9,.82);border-radius:999px;padding:4px 9px}
.card h3{font:600 13px/1.3 var(--font-b);margin:11px 2px 3px}
.card p{font:400 10px var(--font-m);color:var(--muted);margin:0 2px}
.skel{pointer-events:none}
.skel .poster,.bar{background:linear-gradient(100deg,var(--surface2) 30%,var(--surface) 50%,var(--surface2) 70%);
  background-size:220% 100%;animation:shim 1.3s linear infinite}
.bar{height:12px;border-radius:6px;margin:11px 2px 5px}
.empty{text-align:center;padding:56px 20px;border:1px dashed var(--line);border-radius:22px}
.empty h3{font-family:var(--font-d);font-weight:700;text-transform:uppercase;margin:0;
  font-size:1.5rem;color:transparent;-webkit-text-stroke:1.5px var(--muted);animation:floaty 4s ease-in-out infinite}
.empty p{font:400 12px/1.9 var(--font-m);color:var(--muted);max-width:560px;margin:12px auto 0}
.rail{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));grid-gap:12px;margin-top:16px}
.dork{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);
  border-radius:16px;padding:16px;text-decoration:none;transition:.2s;position:relative;overflow:hidden}
.dork:hover{border-color:var(--ember);transform:translateY(-3px)}
.dl{display:flex;justify-content:space-between;align-items:center;font:600 13px var(--font-b);color:var(--text)}
.dl svg{color:var(--ember);flex:none}
.dq{font:400 10px/1.5 var(--font-m);color:var(--muted);word-break:break-word;margin-top:8px}

/* dossier overlay */
.overlay{position:fixed;top:0;right:0;bottom:0;left:0;z-index:40;overflow-y:auto;background:var(--bg);animation:fadeUp .3s ease}
.ov-close{position:fixed;top:20px;right:22px;z-index:46;width:48px;height:48px;border-radius:50%;
  background:rgba(13,11,9,.72);border:1px solid var(--line);color:var(--text);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:.2s}
.ov-close:hover{border-color:var(--ember);color:var(--ember);transform:rotate(90deg)}
.ov-loading{min-height:100vh;display:flex;flex-direction:column;gap:18px;align-items:center;
  justify-content:center;font:400 11px var(--font-m);letter-spacing:.3em;color:var(--muted)}
.ov-loading::before{content:"";width:34px;height:34px;border:2px solid var(--line);
  border-top-color:var(--ember);border-radius:50%;animation:spin .8s linear infinite}
.ov-bd{position:relative;height:52vh;max-height:500px}
.ov-bd img{width:100%;height:100%;object-fit:cover;display:block}
.ov-bd::after{content:"";position:absolute;top:0;right:0;bottom:0;left:0;
  background:linear-gradient(180deg,rgba(13,11,9,.15) 40%,var(--bg))}
.ov-head{position:relative;z-index:2;margin-top:-100px;animation:fadeUp .5s .08s both}
.ov-kick{font:400 10px var(--font-m);letter-spacing:.3em;color:var(--ember)}
.ov-title{font-family:var(--font-d);font-weight:800;text-transform:uppercase;
  font-size:clamp(1.7rem,5vw,3.4rem);line-height:1.03;margin:14px 0 10px}
.tagline{font:400 12px var(--font-m);color:var(--ember);opacity:.85;margin:0 0 16px}
.ov-meta{display:flex;flex-wrap:wrap}
.mchip{border:1px solid var(--line);border-radius:999px;padding:6px 13px;margin:0 10px 10px 0;
  display:flex;align-items:center;font:400 12px var(--font-m);color:var(--muted)}
.mchip i{font-style:normal;opacity:.55;font-size:9px;margin-left:4px}
.mchip.hot{color:var(--gold);border-color:rgba(230,179,77,.4)}
.ov-actions{margin-top:10px;display:flex;flex-wrap:wrap}
.ov-cols{display:grid;grid-template-columns:1.1fr .9fr;grid-gap:44px;padding:38px 0 26px}
.ov-cols>div{animation:fadeUp .5s .2s both}
.ov-cols>div:last-child{animation-delay:.3s}
@media(max-width:900px){.ov-cols{grid-template-columns:1fr}}
.ov-h{display:flex;align-items:center;font:400 10px var(--font-m);letter-spacing:.26em;
  color:var(--muted);margin:30px 0 14px}
.ov-h:first-child{margin-top:0}
.ov-h::after{content:"";flex:1;height:1px;background:var(--line);margin-left:12px}
.ov-p{font:400 15px/1.8 var(--font-b);color:var(--body);margin:0 0 10px}
.ov-p.dim{font:400 12px/1.7 var(--font-m);color:var(--muted)}
.cast{display:flex;overflow-x:auto;padding-bottom:8px}
.person{flex:none;width:78px;text-align:center;margin-right:16px}
.person img,.avatar{display:block;margin:0 auto;width:64px;height:64px;border-radius:50%;
  object-fit:cover;border:1px solid var(--line)}
.avatar{background:var(--surface2);display:flex;align-items:center;justify-content:center;
  font:700 16px var(--font-d);color:var(--muted)}
.nm{font:500 12px var(--font-b);margin:8px 0 2px}
.role{font:400 10px var(--font-m);color:var(--muted);line-height:1.4}
.player{position:relative;padding-top:56.25%;border-radius:16px;overflow:hidden;
  background:var(--surface2);border:1px solid var(--line)}
.player>img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;opacity:.85}
.playbtn{position:absolute;top:0;right:0;bottom:0;left:0;margin:auto;width:74px;height:74px;border-radius:50%;
  background:var(--ember);border:none;color:#180b06;display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:transform .25s;box-shadow:0 0 0 10px rgba(255,90,46,.18)}
.playbtn:hover{transform:scale(1.12)}
.player iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:0}
.wikicard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px}
.wikicard p{font:400 13px/1.75 var(--font-b);color:var(--body);margin:0 0 14px}
.wlink{font:400 11px var(--font-m);letter-spacing:.08em;color:var(--ember);text-decoration:none}
.wlink:hover{text-decoration:underline}
.wcredit{display:block;font:400 9px var(--font-m);letter-spacing:.08em;color:var(--muted);opacity:.75;margin-top:10px}

function detectIntent(q){
  try {
    var s = " " + q.toLowerCase() + " ";
    if (/\b(ncert|cbse|class\s?\d{1,2}|chapter|exercise|syllabus|sample\s?paper|previous\s?year|board\s?exam|worksheet)\b/.test(s)) return "study";
    if (/\b(pdf|ebook|e-book|textbook|slides|presentation|filetype)\b/.test(s)) return "pdf";
    if (/\b(movie|film|cinema|series|trailer|imdb|webseries|web\s?series|cast\s?of|director\s?of)\b/.test(s)) return "movie";
    if (/\b(video|tutorial|lecture|how\s?to|watch)\b/.test(s)) return "video";
    if (/\b(image|images|photo|photos|picture|pic|pics|wallpaper|logo|poster)\b/.test(s)) return "image";
    if (/\b(news|headline|headlines|breaking|latest)\b/.test(s)) return "news";
    if (/\b(translate|translation|meaning\s?of|in\s?hindi|in\s?english)\b/.test(s)) return "translate";
    if (/^(who|what|when|where|why|which|whom)\b/.test(q.trim()) || /\b(wikipedia|definition|defined|encyclopedia|history\s?of)\b/.test(s)) return "wiki";
    if (/\b(near\s?me|map|maps|directions|route|location|address\s?of)\b/.test(s)) return "map";
    if (/\b(code|github|stack\s?overflow|error|bug|python|javascript|react|api|regex)\b/.test(s)) return "code";
    return "web";
  } catch(e){ return "web"; }
}

/* movies */
function tmdb(path, params){
  var key = TMDB_KEY.trim();
  var url = "https://api.themoviedb.org/3" + path;
  var isJwt = key.indexOf("ey") === 0;
  var parts = [];
  if (!isJwt) parts.push("api_key=" + enc(key));
  if (params) for (var k in params) if (params.hasOwnProperty(k)) parts.push(enc(k) + "=" + enc(params[k]));
  if (parts.length) url += (url.indexOf("?") > -1 ? "&" : "?") + parts.join("&");
  var opts = isJwt ? { headers: { Authorization: "Bearer " + key } } : {};
  return fetch(url, opts).then(function(res){
    if (!res.ok) throw new Error(res.status === 401 ? "TMDB rejected the key" : "TMDB error (" + res.status + ")");
    return res.json();
  });
}

function pickTrailer(list){
  var y = [], i;
  for (i = 0; i < list.length; i++) if (list[i].site === "YouTube") y.push(list[i]);
  if (!y.length) return null;
  var pick = null, k;
  for (k = 0; k < y.length; k++) if (y[k].type === "Trailer" && y[k].official) { pick = y[k]; break; }
  if (!pick) for (k = 0; k < y.length; k++) if (y[k].type === "Trailer") { pick = y[k]; break; }
  if (!pick) for (k = 0; k < y.length; k++) if (y[k].type === "Teaser") { pick = y[k]; break; }
  return pick || y[0];
}

/* translator */
var LANGS = [["en","English"],["hi","Hindi"],["bn","Bengali"],["mr","Marathi"],["ta","Tamil"],["te","Telugu"],
  ["gu","Gujarati"],["kn","Kannada"],["ml","Malayalam"],["pa","Punjabi"],["ur","Urdu"],
  ["es","Spanish"],["fr","French"],["de","German"],["it","Italian"],["pt","Portuguese"],
  ["ru","Russian"],["ar","Arabic"],["zh-CN","Chinese"],["ja","Japanese"],["ko","Korean"]];
function chunkText(t, max){
  var parts = t.match(/[^.!?\u0964\n]+[.!?\u0964]*\s*/g) || [t];
  var out = [], cur = "";
  for (var i = 0; i < parts.length; i++) {
    var s = parts[i];
    if (s.length > max) {
      if (cur) { out.push(cur); cur = ""; }
      for (var j = 0; j < s.length; j += max) out.push(s.slice(j, j + max));
      continue;
    }
    if (cur.length + s.length > max) { out.push(cur); cur = s; } else cur += s;
  }
  if (cur) out.push(cur);
  return out.map(function(x){ return x.trim(); }).filter(Boolean);
}
function trChunk(text, from, to){
  var u = "https://api.mymemory.translated.net/get?q=" + enc(text) + "&langpair=" + enc(from) + "%7C" + enc(to);
  return fetch(u).then(function(r){ return r.json(); }).then(function(j){
    var t = (j && j.responseData && j.responseData.translatedText) || null;
    if (typeof t !== "string") throw new Error("Translation service returned nothing");
    if (/MYMEMORY WARNING|QUERY LENGTH LIMIT|INVALID (SOURCE|TARGET)/i.test(t))
      throw new Error("Free translation quota or length limit hit — retry later or shorten");
    return t;
  });
}
function trRun(){
  var src = $("#tr-in").value.trim();
  if (!src) { toast("Type something to translate"); return; }
  var from = $("#tr-from").value, to = $("#tr-to").value;
  if (from === to) { toast("Pick two different languages"); return; }
  var btn = $("#tr-go"), out = $("#tr-out");
  btn.classList.add("loading"); btn.disabled = true;
  out.classList.remove("empty"); out.textContent = "…";
  var chunks = chunkText(src, 450), done = [];
  function step(i){
    if (i >= chunks.length) {
      out.textContent = done.join(" ");
      remember(src.slice(0, 60), "TRANSLATE");
      btn.classList.remove("loading"); btn.disabled = false;
      return;
    }
    trChunk(chunks[i], from, to).then(function(t){
      done.push(t); step(i + 1);
    }).catch(function(err){
      out.textContent = ""; out.classList.add("empty");
      toast(err.message);
      btn.classList.remove("loading"); btn.disabled = false;
    });
  }
  step(0);
}

    if (de) {
      var E = findEng(de.getAttribute("data-eng"));
      if (qv) { remember(qv, E.n); closeDD(); window.open(E.u(qv), "_blank", "noopener"); }
      return;
    }
    var dc = up(ev.target, "data-cu");
    if (dc) {
      var cust = getCustom(), c2 = cust[+dc.getAttribute("data-cu")];
      if (c2 && qv) { remember(qv, c2.n); closeDD(); window.open(c2.t.split("{q}").join(enc(qv)), "_blank", "noopener"); }
    }
  });
  document.addEventListener("click", function(ev){
    if ($("#dd").hidden) return;
    if (!up(ev.target, "data-searchcol")) closeDD();
  });

  $("#mv-go").addEventListener("click", function(){ mvSearch($("#mv-q").value); });
  $("#mv-q").addEventListener("keydown", function(ev){ if (ev.key === "Enter") mvSearch($("#mv-q").value); });
  $("#mv-chips").addEventListener("click", function(ev){
    var c = up(ev.target, "data-s");
    if (c) { $("#mv-q").value = c.getAttribute("data-s"); mvSearch(c.getAttribute("data-s")); }
  });
  $("#mv-grid").addEventListener("click", function(ev){
    var c = up(ev.target, "data-id");
    if (c) openDetail(c.getAttribute("data-id"), c.getAttribute("data-mt"));
  });
  $("#mv-grid").addEventListener("keydown", function(ev){
    if (ev.key !== "Enter") return;
    var c = up(ev.target, "data-id");
    if (c) openDetail(c.getAttribute("data-id"), c.getAttribute("data-mt"));
  });

  $("#wk-lang").addEventListener("click", function(ev){
    var b = up(ev.target, "data-wl"); if (!b) return;
    wikiLang = b.getAttribute("data-wl");
    var all = $all("#wk-lang button");
    for (var i = 0; i < all.length; i++) setOn(all[i], all[i] === b);
    var qv = $("#wk-q").value.trim();
    if (qv) wikiSearch(qv, wikiLang);
  });
  $("#wk-go").addEventListener("click", function(){ wikiSearch($("#wk-q").value, wikiLang); });
  $("#wk-q").addEventListener("keydown", function(ev){ if (ev.key === "Enter") wikiSearch($("#wk-q").value, wikiLang); });
  $("#wk-res").addEventListener("click", function(ev){
    var b = up(ev.target, "data-wt");
    if (b) toggleWikiPin(b.getAttribute("data-wt"), b.getAttribute("data-wl"), b);
  });

  var stl = $all("#st-lang button");
  for (var s = 0; s < stl.length; s++) setOn(stl[s], stl[s].getAttribute("data-sl") === study.lang);
  $("#st-lang").addEventListener("click", function(ev){
    var b = up(ev.target, "data-sl"); if (!b) return;
    study.lang = b.getAttribute("data-sl");
    var all = $all("#st-lang button");
    for (var i = 0; i < all.length; i++) setOn(all[i], all[i] === b);
    renderStudy();
  });
  $("#st-classes").addEventListener("click", function(ev){
    var b = up(ev.target, "data-c"); if (!b) return;
    study.c = +b.getAttribute("data-c");
    if (!NCERT[study.c] || NCERT[study.c].indexOf(study.sub) === -1) study.sub = null;
    renderStudy();
  });
  $("#st-subjects").addEventListener("click", function(ev){
    var b = up(ev.target, "data-s"); if (!b) return;
    study.sub = b.getAttribute("data-s"); renderStudy();
  });

  $("#nw-lang").addEventListener("click", function(ev){
    var b = up(ev.target, "data-nl"); if (!b) return;
    newsLang = b.getAttribute("data-nl");
    var all = $all("#nw-lang button");
    for (var i = 0; i < all.length; i++) setOn(all[i], all[i] === b);
    renderNews();
  });
  $("#nw-go").addEventListener("click", function(){
    var qv = $("#nw-q").value.trim();
    if (qv) { remember(qv, "NEWS DESK"); loadHN(qv); }
    renderNews();
  });
  $("#nw-q").addEventListener("keydown", function(ev){
    if (ev.key !== "Enter") return;
    var qv = $("#nw-q").value.trim();
    if (qv) { remember(qv, "NEWS DESK"); loadHN(qv); }
    renderNews();
  });
  $("#nw-topics").addEventListener("click", function(ev){
    var t = up(ev.target, "data-nt");
    if (t) window.open("https://news.google.com/search?q=" + enc(t.getAttribute("data-nt")) + "&" + newsHl(), "_blank", "noopener");
  });

  var opts = [];
  for (var l = 0; l < LANGS.length; l++) opts.push('<option value="' + LANGS[l][0] + '">' + LANGS[l][1] + '</option>');
  $("#tr-from").innerHTML = opts.join("");
  $("#tr-to").innerHTML = opts.join("");
  $("#tr-from").value = "en"; $("#tr-to").value = "hi";
  $("#tr-swap").addEventListener("click", function(){
    var f = $("#tr-from").value; $("#tr-from").value = $("#tr-to").value; $("#tr-to").value = f;
  });
  $("#tr-in").addEventListener("input", function(){
    $("#tr-count").textContent = this.value.length + " CHARS · AUTO-CHUNKED EVERY 450";
  });
  $("#tr-go").addEventListener("click", trRun);
  $("#tr-in").addEventListener("keydown", function(ev){
    if (ev.key === "Enter" && (ev.ctrlKey || ev.metaKey)) trRun();
  });
  $("#tr-copy").addEventListener("click", function(){
    var t = $("#tr-out").textContent;
    if (!t || $("#tr-out").classList.contains("empty")) { toast("Nothing to copy yet"); return; }
    function ok(){ toast("Copied"); }
    function legacy(){
      var ta = document.createElement("textarea");
      ta.value = t; document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); ok(); } catch(e){ toast("Copy blocked by the browser"); }
      document.body.removeChild(ta);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(ok, legacy);
    else legacy();
  });
  $("#tr-speak").addEventListener("click", function(){
    var t = $("#tr-out").textContent;
    if (!t || $("#tr-out").classList.contains("empty")) { toast("Translate something first"); return; }
    if (!window.speechSynthesis || !window.SpeechSynthesisUtterance) { toast("Speech not supported here"); return; }
    var u = new SpeechSynthesisUtterance(t.slice(0, 600));
    u.lang = $("#tr-to").value;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  });

  $("#en-q").addEventListener("input", function(){ enQuery = this.value; renderEngines(); });
  $("#en-form").addEventListener("submit", function(ev){
    ev.preventDefault();
    var n = $("#en-name").value.trim(), t = $("#en-url").value.trim();
    if (!n || t.indexOf("{q}") === -1 || !/^https?:\/\//.test(t)) {
      toast("Needs a name + full URL containing {q} — e.g. https://kagi.com/search?q={q}");
      return;
    }
    var cust = getCustom(); cust.push({ n: n, t: t });
    setStore("dih_engines", cust);
    $("#en-name").value = ""; $("#en-url").value = "";
    renderEngines(); toast("Engine added");
  });
  $("#en-grid").addEventListener("click", function(ev){
    var del = up(ev.target, "data-di");
    if (del) {
      var cust = getCustom(); cust.splice(+del.getAttribute("data-di"), 1);
      setStore("dih_engines", cust);
      renderEngines(); toast("Engine removed");
      return;
    }
    var qv = enQuery.trim();
    var c = up(ev.target, "data-eng");
    if (c) { var E = findEng(c.getAttribute("data-eng")); if (qv) window.open(E.u(qv), "_blank", "noopener"); return; }
    var cu = up(ev.target, "data-cu");
    if (cu) {
      var cust2 = getCustom(), item = cust2[+cu.getAttribute("data-cu")];
      if (item && qv) window.open(item.t.split("{q}").join(enc(qv)), "_blank", "noopener");
    }
  });

  $("#dock-clear").addEventListener("click", function(){
    setStore("dih_recent", []); renderDock(); toast("History cleared");
  });
  $("#dock-pins").addEventListener("click", function(ev){
    var un = up(ev.target, "data-unpin");
    if (un) {
      ev.stopPropagation();
      var pins = getPins(); pins.splice(+un.getAttribute("data-unpin"), 1);
      setStore("dih_pins", pins); renderDock(); toast("Unpinned");
      return;
    }
    var t = up(ev.target, "data-mid") || up(ev.target, "data-wt");
    if (!t) return;
    if (t.hasAttribute("data-mid")) openDetail(t.getAttribute("data-mid"), t.getAttribute("data-mt"));
    else { showTab("wiki"); $("#wk-q").value = t.getAttribute("data-wt"); wikiSearch(t.getAttribute("data-wt"), t.getAttribute("data-wl")); }
  });
  $("#dock-recent").addEventListener("click", function(ev){
    var t = up(ev.target, "data-rq"); if (!t) return;
    showTab("command");
    $("#q").value = t.getAttribute("data-rq");
    renderDD(true); openDD();
    $("#q").focus();
  });

  document.addEventListener("keydown", function(ev){
    if (ev.key === "Escape") {
      if (!overlay.hidden) { closeOv(); return; }
      if (!$("#dd").hidden) { closeDD(); return; }
      if (state.tab === "command" && $("#q").value) { $("#q").value = ""; renderDD(false); closeDD(); }
    }
    if (ev.key === "/" && overlay.hidden) {
      var a = document.activeElement;
      if (a && (a.tagName === "INPUT" || a.tagName === "TEXTAREA" || a.tagName === "SELECT")) return;
      ev.preventDefault();
      var sel = FOCUSMAP[state.tab];
      if (sel) $(sel).focus();
    }
  });
}

/* boot */
function init(){
  overlay = $("#overlay");
  buildGrain(); startDust(); wire(); renderStudy();
  phTick();
  moveInd();
  addEventListener("resize", moveInd);
  addEventListener("load", moveInd);
  setTimeout(moveInd, 600);
  if (!window.fetch) toast("This browser is too old for live data — doors still work");
  try { $("#q").focus(); } catch(e){}
}
try {
  init();
} catch (err) {
  toast("Boot error: " + err.message);
}
window.addEventListener("error", function(ev){
  toast("Error: " + (ev.message || "unknown"));
});
</script>
</body>
</html>
