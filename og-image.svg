<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="DASHBOARD V2 - every film you love">
  <defs>
    <radialGradient id="emberGlow" cx="50%" cy="34%" r="65%">
      <stop offset="0%" stop-color="#ff5a2e" stop-opacity="0.36"/>
      <stop offset="38%" stop-color="#ff5a2e" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#ff5a2e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="50%" cy="46%" r="80%">
      <stop offset="55%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.6"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff8a55" stop-opacity="0.20"/>
      <stop offset="50%" stop-color="#ff5a2e" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ff5a2e" stop-opacity="0"/>
    </linearGradient>
    <filter id="emberGlowFilter" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

